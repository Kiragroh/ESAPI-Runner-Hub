; Copy this file to settings.ini and edit it in the Hub or a text editor.
; Valid explicit ESAPI paths win. Missing paths fall back to the highest complete local RTM installation.
; VMS assemblies are not distributed with this project.

[Hub]
EsapiApiAssembly=%ESAPI_HOME%\VMS.TPS.Common.Model.API.dll
EsapiTypesAssembly=%ESAPI_HOME%\VMS.TPS.Common.Model.Types.dll
SearchMaxResults=10
SearchDebounceMs=150
PathProbeTimeoutMs=1500
LogDirectory=%LOCALAPPDATA%\ESAPI Runner Hub\Logs

[Application.classic-runner]
Name=Classic ESAPI Runner
Category=Plan review
Description=Existing runner with its own patient and plan selection.
LaunchKind=Executable
Executable=apps\ClassicRunner\Classic.Runner.exe
WorkingDirectory=apps\ClassicRunner
Arguments=
PatientMode=Optional
PatientTransport=None
PatientArgumentTemplate=
PatientEnvironmentKey=
Enabled=true
SortOrder=10

[Application.patient-aware]
Name=Patient-aware Standalone Tool
Category=Documents
Description=Standalone executable that accepts an optional patient ID argument.
LaunchKind=Executable
Executable=apps\PatientAware\PatientAware.exe
WorkingDirectory=apps\PatientAware
Arguments=--workbench
PatientMode=Optional
PatientTransport=Argument
PatientArgumentTemplate=--patient-id {PatientId}
PatientEnvironmentKey=
Enabled=true
SortOrder=20

[Application.required-environment]
Name=Required Patient Tool
Category=Export
Description=Example executable that requires a patient ID in its child environment.
LaunchKind=Executable
Executable=apps\RequiredPatient\RequiredPatient.exe
WorkingDirectory=apps\RequiredPatient
Arguments=
PatientMode=Required
PatientTransport=Environment
PatientArgumentTemplate=
PatientEnvironmentKey=RUNNER_PATIENT_ID
Enabled=true
SortOrder=30

[Application.utility]
Name=Patient-independent Utility
Category=Utilities
Description=Application that can always start without patient context.
LaunchKind=Executable
Executable=apps\Utility\Utility.exe
WorkingDirectory=apps\Utility
Arguments=
PatientMode=None
PatientTransport=None
PatientArgumentTemplate=
PatientEnvironmentKey=
Enabled=true
SortOrder=40

[Application.eclipse-plugin]
Name=Example Eclipse Plug-in
Category=Eclipse plug-ins
Description=Reference card for a plug-in that is started inside Eclipse via Tools > Scripts.
LaunchKind=EclipsePlugin
Executable=plugins\Example.esapi.dll
WorkingDirectory=plugins
Arguments=
PatientMode=None
PatientTransport=None
PatientArgumentTemplate=
PatientEnvironmentKey=
Enabled=true
SortOrder=50
